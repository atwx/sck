---
Name: autotranslate
After:
  - '#sckfluent'
Only:
  moduleexists: 's2hub/silverstripe-autotranslate'
---

SilverStripe\CMS\Model\SiteTree:
  extensions:
    autotranslate: S2Hub\AutoTranslate\Extension\AutoTranslate
  translate_ignore:
    - URLSegment

SilverStripe\LinkField\Models\Link:
  extensions:
    - S2Hub\AutoTranslate\Extension\AutoTranslate
  field_exclude:
    - OwnerRelation
    - OwnerClass
    - Owner

DNADesign\Elemental\Models\BaseElement:
  extensions:
    - S2Hub\AutoTranslate\Extension\AutoTranslate
  translate:
    - Title
    - IsAutoTranslated
    - LastTranslation

Atwx\Sck\Tags\TaggableDataObject:
  extensions:
    - S2Hub\AutoTranslate\Extension\AutoTranslate
  field_include:
    - IsAutoTranslated
    - LastTranslation

Atwx\Sck\Tags\Tag:
  extensions:
    - S2Hub\AutoTranslate\Extension\AutoTranslate
  field_include:
    - IsAutoTranslated
    - LastTranslation

# Declares `translate` in PHP, which wins over `field_include`, so extend that list.
Atwx\Sck\Models\FooterColumn:
  extensions:
    - S2Hub\AutoTranslate\Extension\AutoTranslate
  translate:
    - IsAutoTranslated
    - LastTranslation

Atwx\Sck\Models\GalleryVideo:
  extensions:
    - S2Hub\AutoTranslate\Extension\AutoTranslate
  field_include:
    - IsAutoTranslated
    - LastTranslation

Atwx\Sck\News\NewsCategory:
  extensions:
    - S2Hub\AutoTranslate\Extension\AutoTranslate
  field_include:
    - IsAutoTranslated
    - LastTranslation

Atwx\Sck\People\PersonGroup:
  extensions:
    - S2Hub\AutoTranslate\Extension\AutoTranslate
  field_include:
    - IsAutoTranslated
    - LastTranslation

Atwx\Sck\Elements\AccordionItem:
  extensions:
    - S2Hub\AutoTranslate\Extension\AutoTranslate
  field_include:
    - IsAutoTranslated
    - LastTranslation

Atwx\Sck\Elements\AccordionSmallItem:
  extensions:
    - S2Hub\AutoTranslate\Extension\AutoTranslate
  field_include:
    - IsAutoTranslated
    - LastTranslation

# Declares `translate` in PHP, which wins over `field_include`, so extend that list.
Atwx\Sck\Elements\CardSlide:
  extensions:
    - S2Hub\AutoTranslate\Extension\AutoTranslate
  translate:
    - IsAutoTranslated
    - LastTranslation

Atwx\Sck\Elements\CitationItem:
  extensions:
    - S2Hub\AutoTranslate\Extension\AutoTranslate
  field_include:
    - IsAutoTranslated
    - LastTranslation

# Declares `translate` in PHP, which wins over `field_include`, so extend that list.
Atwx\Sck\Elements\HeroSlide:
  extensions:
    - S2Hub\AutoTranslate\Extension\AutoTranslate
  translate:
    - IsAutoTranslated
    - LastTranslation

Atwx\Sck\Elements\TeaserItem:
  extensions:
    - S2Hub\AutoTranslate\Extension\AutoTranslate
  field_include:
    - IsAutoTranslated
    - LastTranslation

